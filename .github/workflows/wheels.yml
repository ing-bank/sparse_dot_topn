name: Build and Publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - pyproject.toml
      - src/sparse_dot_topn_core/**
      - .github/actions/build-libomp/**
      - .github/workflows/wheels.yml
  push:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build SDist
        run: pipx run build --sdist

      - name: Normalize sdist filename
        shell: bash
        run: |
          shopt -s nullglob
          cd dist

          for f in *.tar.gz; do
            if [[ "$f" =~ ^([a-zA-Z0-9-]+)-([0-9].*)$ ]]; then
              name_part="${BASH_REMATCH[1]}"
              version_part="${BASH_REMATCH[2]}"

              normalized_name="${name_part//-/_}"
              new_filename="${normalized_name}-${version_part}"

              if [[ "$f" != "$new_filename" ]]; then
                echo "Renaming '$f' -> '$new_filename'"
                mv "$f" "$new_filename"
              fi
            fi
          done
          ls -la .

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build OpenMP
        if: runner.os == 'macOS'
        uses: ./.github/actions/build-libomp
        with:
          arch: arm64
          deployment-target: "12.0"
          prefix: ${{ runner.temp }}/libomp

      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DSDTN_ENABLE_ARCH_FLAGS=OFF -DSDTN_ENABLE_OPENMP=ON -DSDTN_DISABLE_OPENMP=OFF"
          CIBW_TEST_COMMAND: pytest {project}/tests && python -c "from sparse_dot_topn import _has_openmp_support;assert _has_openmp_support"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=12.0 DYLD_LIBRARY_PATH="${{ runner.temp }}/libomp/lib" CMAKE_ARGS="-DSDTN_ENABLE_ARCH_FLAGS=OFF -DSDTN_VENDOR_OPENMP=ON -DSDTN_ENABLE_OPENMP=ON -DSDTN_DISABLE_OPENMP=OFF -DOpenMP_ROOT=${{ runner.temp }}/libomp"

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-to-testpypi:
    name: Publish release on TestPyPi
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ing-bank' && github.event_name == 'release' # prevent forks from running this step
    environment: testrelease
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi-publish:
    name: Publish release on PyPi
    needs: [build_sdist, build_wheels, publish-to-testpypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.prerelease == false
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
