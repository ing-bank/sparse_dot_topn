name: Build and install
description: >
  Set up Python and install sparse_dot_topn with its test dependencies from the checked-out source.
  CMake options can be passed through the CMAKE_ARGS environment variable.

inputs:
  python-version:
    description: Python version to set up
    required: true
  pip-args:
    description: Extra arguments for `pip install`, e.g. pinned dependencies or config settings
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Build and install
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --verbose ".[test]" ${{ inputs.pip-args }}
